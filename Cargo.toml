[package]
name = "md-lab-web-backend"
version = "0.1.0"
edition = "2021"
description = "MD Lab web platform — lightweight Rust/Axum API backend"
license = "MIT"

[lib]
name = "md_lab_web_backend"
path = "src/lib.rs"

[[bin]]
name = "md-lab-web-backend"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
